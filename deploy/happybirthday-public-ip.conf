# 生日 H5 — 公网 IP 免端口访问（HTTP 80）
#
# 访问：http://<公网IP>/
# 对内：Python 只绑回环
#   cd /home/wong/MachineLearing/happybirthday
#   python3 -m http.server 18099 --bind 127.0.0.1
#
# 必须成为 listen 80 的 default_server，否则 Host 为 IP 时会落到别的站点。
# 启用前请去掉 plantanswer-public-ip.conf 上的 default_server。
#
# 安装（需 sudo）：
#   sudo cp /home/wong/MachineLearing/happybirthday/deploy/happybirthday-public-ip.conf \
#       /etc/nginx/sites-available/happybirthday-public-ip.conf
#   sudo ln -sf /etc/nginx/sites-available/happybirthday-public-ip.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:18099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?|wav|mp3|ogg)$ {
        proxy_pass http://127.0.0.1:18099;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
