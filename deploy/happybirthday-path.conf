# 生日 H5 — 挂到现有 80 端口的路径前缀（不抢 default_server）
#
# 把下面整个 location 块，追加到：
#   /etc/nginx/sites-available/plantanswer-public-ip.conf
# 的 server { } 里（与现有 location / 并列，且必须写在 location / 之前）。
#
# 访问：http://<公网IP>/mia/
#
# 前提：本机静态服务（与独立端口方案共用 18099）
#   python3 -m http.server 18099 --bind 127.0.0.1
# 在 /home/wong/MachineLearing/happybirthday 目录下启动。

# 无尾斜杠时补上，保证相对路径 css/js 能解析到 /mia/css/...
location = /mia {
    return 301 /mia/;
}

location /mia/ {
    proxy_pass http://127.0.0.1:18099/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}
